name: Deploy

# Updates the CRM on the VPS by re-running crm/deploy/install.sh over SSH, for the branch chosen in
# "Run workflow". Needs repository secrets DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY (optional DEPLOY_PORT).
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the site's SSL certificate
        continue-on-error: true
        run: |
          getent hosts event.colombiabirdfair.com || true
          echo | openssl s_client -connect event.colombiabirdfair.com:443 -servername event.colombiabirdfair.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates || echo "No se pudo leer un certificado en el puerto 443."
          curl -sS -o /dev/null -w "HTTPS %{http_code}, verificación SSL: %{ssl_verify_result}\n" https://event.colombiabirdfair.com/login || true

      - name: Check that the server accepts SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          if timeout 10 bash -c "</dev/tcp/$HOST/$PORT"; then echo "El puerto SSH $PORT responde."; else
            echo "::error::El servidor no responde en el puerto SSH $PORT. Revisa que DEPLOY_HOST sea la IP del VPS, el puerto de SSH y el firewall de Hostinger/CyberPanel."
            exit 1
          fi

      - name: Run installer on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: BRANCH,SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            curl -fsSLo /root/crm-install.sh "https://raw.githubusercontent.com/keineria/crmevent-cb/${SHA}/crm/deploy/install.sh"
            bash /root/crm-install.sh event.colombiabirdfair.com "$BRANCH" </dev/null
